<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JEE PYQ Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--fg:#1d1d1b;--card:#fff;--line:#d9d6cc;--acc:#2f5bd8;--ok:#1f9d55;--mut:#6b6a63;--bad:#d64545;--warn:#e89a1c;--Physics:#2f6fe0;--Chemistry:#16a085;--Maths:#8e44ad}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--fg:#ecebe6;--card:#222428;--line:#3a3d43;--acc:#7da0ff;--ok:#4cc27f;--mut:#9a9a94;--bad:#ff7070;--warn:#ffb84a}}
:root[data-theme="dark"]{--bg:#17181b;--fg:#ecebe6;--card:#222428;--line:#3a3d43;--acc:#7da0ff;--ok:#4cc27f;--mut:#9a9a94;--bad:#ff7070;--warn:#ffb84a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:2.2rem;margin:4vh 0 4px;text-align:center}
.sub{text-align:center;color:var(--mut);margin-bottom:24px}
h2{font-size:1.3rem;margin:8px 0 12px}
h3{font-size:1rem;margin:20px 0 10px}
.big{display:block;width:100%;padding:18px;margin:0 0 12px;font-size:1.15rem;font-weight:600;background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:10px;cursor:pointer;text-align:left}
.big:hover{border-color:var(--acc)}
.big small{display:block;font-weight:400;color:var(--mut);font-size:.85rem;margin:4px 0 8px}
.big[data-c]{border-left:8px solid var(--c)}
.back{background:none;border:0;color:var(--acc);font-size:1rem;cursor:pointer;padding:4px 0;margin-bottom:8px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:.95rem;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff6b6b,#ffb84a,#4cc27f,#2f9bff);background-size:300px 100%}
.grade{margin:22px 0 8px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between}
.ch{margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--line));border-radius:8px}
.ch.done{border-color:var(--ok);border-left-color:var(--ok)}
.ch.done .n{text-decoration:line-through;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px}
.n{flex:1;cursor:pointer}
.n small{display:block;color:var(--mut);font-size:.75rem;text-decoration:none}
.ck{width:34px;height:34px;flex:none;border:2px solid var(--line);border-radius:8px;background:transparent;color:#fff;font-size:1.1rem;cursor:pointer}
.ch.done .ck{background:var(--ok);border-color:var(--ok)}
.lv{flex:none;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:99px;color:#fff;background:var(--mut)}
.L1{background:#e67e22}.L2{background:#d4ac0d}.L3{background:#27ae60}.L4{background:#2980b9}.L5{background:#8e44ad}
.panel{padding:4px 14px 14px;border-top:1px dashed var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}
.stat{background:var(--bg);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-size:1.15rem}
.stat span{font-size:.72rem;color:var(--mut)}
.stat.g b{color:var(--ok)}.stat.r b{color:var(--bad)}.stat.o b{color:var(--warn)}.stat.b b{color:var(--acc)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;align-items:end}
label{font-size:.72rem;color:var(--mut);display:block}
input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font-size:.95rem}
table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:8px}
td,th{padding:5px 4px;text-align:left;border-bottom:1px solid var(--line)}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:1rem}
.ladder{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.ladder div{flex:1;min-width:110px;padding:8px;border-radius:8px;color:#fff;font-size:.78rem;opacity:.35}
.ladder div.on{opacity:1}
.ladder b{display:block;font-size:.95rem}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bd{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center;filter:grayscale(1);opacity:.55}
.bd.on{filter:none;opacity:1;border-color:var(--warn);background:linear-gradient(135deg,rgba(255,184,74,.25),rgba(255,107,107,.15))}
.bd .e{font-size:2rem}.bd small{display:block;color:var(--mut);font-size:.72rem}
.hero{background:linear-gradient(135deg,#6a11cb,#2575fc,#ff6a88);color:#fff;border-radius:14px;padding:18px;text-align:center;margin-bottom:16px;font-size:1.05rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:10px 0}
.tc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.tc small{color:var(--mut);display:block}.tc b{display:block;font-size:2.2rem;line-height:1.1}.tc span{font-size:.8rem;color:var(--mut);display:block;margin-bottom:8px}.tc p{margin:8px 0 4px;font-size:.9rem}
.chips{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:8px}.chips i{font-style:normal;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mut)}.chips i.on{background:linear-gradient(90deg,#ff9a3c,#ff4d6d);color:#fff;font-weight:700}
.sa{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px}.sa b{font-size:1.1rem}.sa em{display:block;font-style:normal;font-size:.8rem;font-weight:700}.sa span{display:block;font-size:1.8rem;font-weight:700;color:var(--c)}.sa small{color:var(--mut)}
.sa.best{border-color:var(--ok);background:rgba(31,157,85,.12)}.sa.best em{color:var(--ok)}.sa.poor{border-color:var(--bad);background:rgba(214,69,69,.14);animation:pl 2s infinite}.sa.poor em{color:var(--bad)}
@keyframes pl{50%{box-shadow:0 0 0 4px rgba(214,69,69,.25)}}
.cc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.hr{text-align:center}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:90%;background:linear-gradient(90deg,#ff9a3c,#ff4d6d);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.L6{background:#c0392b}.L7{background:#d4af37}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4vh 0 4px}.top h1{margin:0;text-align:left;font-size:2rem}
.upd{box-shadow:0 0 0 2px #22c55e,0 0 14px rgba(34,197,94,.45)!important}
.ut{display:inline-block;margin-left:8px;font-style:normal;font-size:.68rem;font-weight:700;color:#fff;background:#22c55e;padding:2px 8px;border-radius:99px;vertical-align:middle}
.lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:10px 0}
.lc{border-radius:10px;padding:10px;color:#fff;font-size:.78rem}.lc>b{display:block;font-size:.9rem;margin-bottom:4px}.lc div{margin-top:3px}.lc div:not(.ok){opacity:.7}.lc small{opacity:.9}.lc.full{box-shadow:0 0 0 3px #ffd54a,0 0 14px rgba(255,213,74,.6)}
summary{cursor:pointer;color:var(--acc);margin:6px 0}
.rc{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}.rc>div{flex:1;min-width:140px}
.ro .form,.ro .x,.ro .ck,.ro .ed{display:none}
.cbx{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 10px;max-height:190px;overflow:auto;padding:6px 0}.cbx label{font-size:.82rem;display:flex;gap:6px;align-items:flex-start;color:var(--fg)}.cbx input{width:16px;height:16px;padding:0;flex:none}
details.chd{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0;background:var(--card)}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:28px}
#st{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:.75rem;color:var(--mut);background:var(--card);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
.tk{display:flex;gap:8px;padding:6px 0;align-items:flex-start;font-size:.88rem}.tk input{width:20px;height:20px;flex:none}.tk.on span{text-decoration:line-through;color:var(--mut)}.tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.dc{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--acc));border-radius:10px;padding:10px 12px;margin-bottom:10px}.dc small{color:var(--mut)}
</style></head><body><main id="app"></main><div id="st">loading…</div><input type="file" id="fi" accept=".json" hidden>
<script>
const D={
mains:{name:"JEE Mains",sub:"NTA syllabus",
Physics:{11:["Units & Measurements","Kinematics","Laws of Motion","Work, Energy & Power","Centre of Mass & Rotational Motion","Gravitation","Mechanical Properties of Solids","Mechanical Properties of Fluids","Thermal Properties of Matter","Thermodynamics","Kinetic Theory of Gases","Oscillations (SHM)","Waves & Sound"],
12:["Electrostatics","Current Electricity","Moving Charges & Magnetism","Magnetism & Matter","Electromagnetic Induction","Alternating Current","Electromagnetic Waves","Ray Optics","Wave Optics","Dual Nature of Matter & Radiation","Atoms","Nuclei","Semiconductor Electronics"]},
Chemistry:{11:["Some Basic Concepts of Chemistry (Mole Concept)","Atomic Structure","Classification of Elements & Periodicity","Chemical Bonding & Molecular Structure","States of Matter (Gaseous State)","Chemical Thermodynamics","Chemical Equilibrium","Ionic Equilibrium","Redox Reactions","General Organic Chemistry (GOC)","Hydrocarbons"],
12:["Solutions","Electrochemistry","Chemical Kinetics","p-Block Elements","d- and f-Block Elements","Coordination Compounds","Principles of Qualitative Analysis","Haloalkanes & Haloarenes","Alcohols, Phenols & Ethers","Aldehydes, Ketones & Carboxylic Acids","Amines","Biomolecules"]},
Maths:{11:["Sets, Relations & Functions","Complex Numbers & Quadratic Equations","Permutations & Combinations","Binomial Theorem","Sequences & Series","Trigonometry","Straight Lines","Circles","Conic Sections (Parabola, Ellipse, Hyperbola)","Limits & Derivatives","Statistics","Mathematical Reasoning"],
12:["Matrices & Determinants","Inverse Trigonometric Functions","Continuity & Differentiability","Application of Derivatives","Indefinite Integration","Definite Integration","Area Under Curves","Differential Equations","Vector Algebra","Three Dimensional Geometry","Probability"]}},
adv:{name:"JEE Advanced",sub:"IIT syllabus",
Physics:{11:["General Physics (Units, Dimensions & Error Analysis)","Kinematics","Newton's Laws & Friction","Work, Energy & Power","Centre of Mass & Collisions","Rotational Mechanics","Gravitation","Simple Harmonic Motion","Fluid Mechanics","Elasticity & Surface Tension","Thermal Expansion & Calorimetry","Heat Transfer & Thermal Radiation","Kinetic Theory & Thermodynamics","Waves on String & Sound Waves"],
12:["Electrostatics","Capacitors","Current Electricity","Moving Charges & Magnetism","Electromagnetic Induction & Inductance","Electromagnetic Waves","Ray Optics","Wave Optics","Photoelectric Effect & Atomic Models (Bohr)","X-Rays","Nuclear Physics & Radioactivity"]},
Chemistry:{11:["Mole Concept & Stoichiometry","Atomic Structure","Periodic Properties","Chemical Bonding","Gaseous State","Chemical & Ionic Equilibrium","Thermodynamics & Thermochemistry","Redox Reactions","Hydrogen & s-Block Elements","General Organic Chemistry (GOC)","Hydrocarbons","Stereochemistry & Isomerism"],
12:["Solutions","Electrochemistry","Chemical Kinetics","Solid State","Surface Chemistry","p-Block Elements","d- and f-Block Elements","Coordination Compounds","Isolation of Metals (Metallurgy)","Qualitative Analysis","Haloalkanes & Haloarenes","Alcohols, Phenols & Ethers","Aldehydes & Ketones","Carboxylic Acids & Derivatives","Amines","Biomolecules","Polymers","Practical Organic Chemistry"]},
Maths:{11:["Complex Numbers","Quadratic Equations & Inequalities","Sequences & Series","Permutations & Combinations","Binomial Theorem","Trigonometric Functions & Equations","Straight Lines","Circles","Parabola","Ellipse","Hyperbola"],
12:["Matrices & Determinants","Probability","Inverse Trigonometric Functions","Functions","Limits, Continuity & Differentiability","Application of Derivatives","Indefinite Integration","Definite Integration & Area","Differential Equations","Vector Algebra","Three Dimensional Geometry","Properties of Triangles"]}}};

/* ===== TARGET LEVELS: edit these numbers to change the goals =====
   acc = accuracy %, qph = questions per hour, cov = % of chapter PYQs attempted */
const LV={mains:[{n:1,name:"Starter",acc:60,qph:10,cov:20},{n:2,name:"Builder",acc:70,qph:15,cov:40},{n:3,name:"Performer",acc:75,qph:18,cov:60},{n:4,name:"Achiever",acc:80,qph:20,cov:80},{n:5,name:"JEE Ready",acc:85,qph:25,cov:100}],
 adv:[{n:1,name:"Starter",acc:60,qph:8,cov:20},{n:2,name:"Builder",acc:70,qph:10,cov:40},{n:3,name:"Performer",acc:75,qph:12,cov:60},{n:4,name:"Achiever",acc:80,qph:15,cov:80},{n:5,name:"JEE Ready",acc:85,qph:17,cov:100}]},L=LV.mains;
const SUBJ=["Physics","Chemistry","Maths"];
const app=document.getElementById("app"),st=document.getElementById("st");
let done={},data={},view={e:null,s:null,open:null};
const key=(e,s,g,c)=>[e,s,g,c].join("|");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const f1=x=>x?x.toFixed(1):"–", pc=x=>Math.round(x)+"%";
const setSt=t=>st.textContent=t;
const ld=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),today=ld;

function keys(e,s){const o=[];for(const sub of s?[s]:SUBJ)for(const g of [11,12])D[e][sub][g].forEach(c=>o.push(key(e,sub,g,c)));return o}
const allKeys=()=>["mains","adv"].flatMap(e=>keys(e));
function calc(rows,total){let c=0,w=0,u=0,t=0;const pq=[],rate=[];
 rows.forEach(x=>{c+=x.c;w+=x.w;u+=x.u;t+=x.t;const a=x.c+x.w;if(a>0&&x.t>0){pq.push(x.t/a);rate.push(a/(x.t/60))}});
 const att=c+w;
 return{c,w,u,t,att,n:rows.length,total,acc:att?c/att*100:0,qph:rate.length?rate.reduce((a,b)=>a+b)/rate.length:0,
  avg:att&&t?t/att:0,mx:pq.length?Math.max(...pq):0,mn:pq.length?Math.min(...pq):0,cov:total?Math.min(100,att/total*100):0}}
const rowsOf=k=>(data[k]&&data[k].s)||[];
const S=k=>calc(rowsOf(k),(data[k]&&data[k].total)||0);
const agg=ks=>calc(ks.flatMap(rowsOf),ks.reduce((a,k)=>a+((data[k]&&data[k].total)||0),0));
function lvl(s,ex){let n=0;for(const l of LV[ex||"mains"]){if(s.n&&s.acc>=l.acc&&s.qph>=l.qph&&s.cov>=l.cov)n=l.n;else break}return n}
const lvChip=n=>`<span class="lv L${n}">${n?"Level "+n:"Level 0"}</span>`;
function gap(s,ex){const l=LV[ex||"mains"][lvl(s,ex)];if(!l)return"Top level reached 🏆";
 const p=[];if(s.acc<l.acc)p.push(`accuracy ${pc(s.acc)} → ${l.acc}%`);if(s.qph<l.qph)p.push(`speed ${f1(s.qph)} → ${l.qph} Q/hr`);if(s.cov<l.cov)p.push(`coverage ${pc(s.cov)} → ${l.cov}%`);
 return`Next: Level ${l.n} (${l.name}) — ${p.join(", ")||"keep going"}`}
function bestStreak(){const d=[...new Set([...acts().map(a=>a.d),...tl().map(x=>x.d)])].sort();let b=0,r=0,p=null;
 d.forEach(x=>{const t=Date.parse(x);r=p!==null&&t-p===864e5?r+1:1;p=t;b=Math.max(b,r)});return b}
function badges(){const ks=allKeys(),A=agg(ks),dn=ks.filter(k=>done[k]).length,l3=ks.filter(k=>lvl(S(k),k.split("|")[0])>=3).length,l5=ks.filter(k=>lvl(S(k),k.split("|")[0])>=5).length,sk=bestStreak();
 return[["🚀","First Step","Log your first session",A.n>=1],["💯","Century","100 questions attempted",A.att>=100],["🔥","500 Club","500 questions attempted",A.att>=500],["🏔️","1000 Club","1000 questions attempted",A.att>=1000],["🌋","2000 Club","2000 questions attempted",A.att>=2000],["🛰️","5000 Club","5000 questions attempted",A.att>=5000],["🌌","10000 Club","10000 questions attempted",A.att>=10000],
 ["🎯","Sharp Shooter","80%+ accuracy (50+ Qs)",A.att>=50&&A.acc>=80],["⚡","Speed Demon","20+ Q/hour overall",A.qph>=20],["✅","Chapter Done x5","5 chapters marked done",dn>=5],["🏅","Chapter Done x20","20 chapters marked done",dn>=20],
 ["📅","7-Day Streak","Practice 7 days in a row",sk>=7],["🌟","Level 3 x5","5 chapters at Level 3+",l3>=5],["👑","Master","Any chapter at Level 5",l5>=1],["🏆","Overall Level 3","Overall level 3 or more",Math.max(lvl(agg(keys("mains")),"mains"),lvl(agg(keys("adv")),"adv"))>=3],["📝","Mains 200+","Score 200+ in a Mains test",bestT("mains")>=200],["🥇","Mains 250+","Score 250+ in a Mains test",bestT("mains")>=250],["🧠","Adv 125+","125+ in a JEE Adv paper",bestT("adv")>=125],["💎","Adv 170+","170+ in a JEE Adv paper",bestT("adv")>=170],["🎓","PW Mains 200+","200+ in a PW Mains-pattern test",bestT("mains","pw")>=200],["🎖️","PW Mains 250+","250+ in a PW Mains-pattern test",bestT("mains","pw")>=250],["🏵️","PW Adv 200+","200+ out of 360 in a PW Adv-pattern test (P1+P2)",bestComb("adv","pw")>=200],["📆","200 Qs Day","200+ questions in one day",maxDay()>=200],["🗓️","700 Qs Week","700+ questions in one week",maxWeek()>=700]]}

function bar(p,c){return`<div class="bar"><i style="width:${Math.min(100,p)}%;${c?`background:${c}`:""}"></i></div>`}
function stat(l,v,c=""){return`<div class="stat ${c}"><b>${v}</b><span>${l}</span></div>`}

function render(){
 const y=scrollY;
 if(view.p==="plan")app.innerHTML=planPage();else if(view.p==="tests")app.innerHTML=testsPage("mock");else if(view.p==="pw")app.innerHTML=testsPage("pw");else if(view.p==="prac")app.innerHTML=pracPage();else if(view.p==="report")app.innerHTML=reportPage();else if(!view.e)home();else if(!view.s)subjects();else chapters();
 scrollTo(0,y)}

function home(){
 const A=agg(allKeys()),n=lvl(A),B=badges();
 app.innerHTML=`<div class="top"><h1>Hello Jainav 👋</h1>${ONLINE?(ro?'<button class="btn" data-act="unlock">🔒 Edit</button>':'<button class="btn alt" data-act="lock">🔓 Lock</button>'):""}</div><p class="sub">Your JEE PYQ tracker</p>${dash()}`+
 ["mains","adv"].map(e=>{const a=agg(keys(e)),d=keys(e).filter(k=>done[k]).length;
  return`<button class="big${grpU(keys(e))?" upd":""}" data-act="exam" data-e="${e}">${D[e].name}${grpU(keys(e))?ut(grpQ(keys(e))+" Qs"):""}<small>${D[e].sub} · ${d} / ${keys(e).length} chapters done · ${a.att} Qs attempted · ${pc(a.acc)} accuracy</small>${bar(keys(e).length?d/keys(e).length*100:0)}</button>`}).join("")+
 `<h3>🎯 Overall target level</h3><p class="sub" style="margin:0">💎 any one target · 🏆 any two targets · 👑 all three targets · Speed (Q/hour) uses the latest 7 days</p>${lvBlock()}
 <div class="grid">${stat("Working-day streak (best "+bestStreak()+")",streak(),"o")}</div>
 ${charts()}<h3>🏆 Achievements (${B.filter(b=>b[3]).length} / ${B.length})</h3><div class="badges">${B.map(b=>`<div class="bd ${b[3]?"on":""}"><div class="e">${b[0]}</div><b>${b[1]}</b><small>${b[2]}</small></div>`).join("")}</div>
 <div class="tools"><button class="btn" data-act="xls">⬇ Download Excel</button><button class="btn alt" data-act="exj">⬇ Export JSON backup</button><button class="btn alt ed" data-act="imj">⬆ Import JSON backup</button></div>`}

function subjects(){const E=D[view.e];
 app.innerHTML=`<button class="back" data-act="back">← Back</button><h2>${E.name}: choose subject</h2>`+SUBJ.map(s=>{const ks=keys(view.e,s),n=ks.filter(k=>done[k]).length,a=agg(ks);
  return`<button class="big${grpU(ks)?" upd":""}" data-act="subj" data-s="${s}" data-c style="--c:var(--${s})">${s}${grpU(ks)?ut(grpQ(ks)+" Qs"):""}<small>${n} / ${ks.length} chapters PYQs done · ${a.att} Qs · ${pc(a.acc)} accuracy · ${lvChip(lvl(a,view.e))}</small>${bar(n/ks.length*100,`var(--${s})`)}</button>`}).join("")}

function chapters(){const E=D[view.e],Sb=E[view.s],A=agg(keys(view.e,view.s));
 app.innerHTML=`<button class="back" data-act="back">← Back</button><h2>${E.name} · ${view.s} ${lvChip(lvl(A,view.e))}</h2><p class="sub" style="margin:0 0 8px">${esc(gap(A,view.e))}</p><details><summary>🎯 ${view.s} level targets (accuracy · speed · PYQs)</summary>${lvlCards(A,view.e)}</details>`+

 return[...Array(8)].map((_,i)=>addD(t0,(i-3)*7)).map(w=>{const e=addD(w,6),G=GW(w),inw=x=>x.d>=w&&x.d<=e,gd=GD().filter(inw),pq=gd.filter(x=>x.k==="q").reduce((n,x)=>n+x.n,0),pt=gd.filter(x=>x.k==="t").reduce((n,x)=>n+x.n,0)+GT().filter(inw).length;
  const goal=G.q||pq||WT[0],dq=sum(A,w,e),dt=tl().filter(inw).length,cur=w===t0,days=[...Array(7)].map((_,j)=>sum(A,addD(w,j),addD(w,j))),dtier=DT.map(v=>[v,days.filter(n=>n>=v).length]).filter(o=>o[1]),bt=k=>Math.max(0,...tl().filter(x=>inw(x)&&x.k===k).map(tot));
  return`<div class="dc" style="--c:${cur?"var(--ok)":"var(--acc)"}"><b>${sd(w)} – ${sd(e)}${cur?" · THIS WEEK":""}</b> <small>Mon–Sun</small>
  <label class="tk${G.a?" on":""}"><input type="checkbox" data-act="gwtk" data-w="${w}" data-f="a" ${G.a?"checked":""}><span>Total questions: <b>${dq}</b> / goal <b>${goal}</b>${dq>=goal?" ✅ achieved":""} <small>(planned in day-wise: ${pq})</small></span></label>${bar(dq/goal*100)}
  <div class="ed" style="margin:4px 0"><label>Set weekly goal (Qs)</label><input type="number" min="0" class="gwq" data-w="${w}" value="${G.q||""}" placeholder="${pq||WT[0]}"></div>
  <label class="tk${G.b?" on":""}"><input type="checkbox" data-act="gwtk" data-w="${w}" data-f="b" ${G.b?"checked":""}><span>Tests done: <b>${dt}</b> / planned <b>${pt}</b>${pt&&dt>=pt?" ✅":""} <small>(day-wise + test-wise plans)</small></span></label>
  <p style="margin:6px 0 2px"><b>Target goals</b> <small>(weekly Qs targets reached are highlighted)</small></p><div class="chips" style="justify-content:flex-start">${WT.map(v=>`<i class="${dq>=v?"on":""}">${v}</i>`).join("")}</div>
  <small>${dtier.length?"Daily targets hit: "+dtier.map(o=>o[0]+"+ ×"+o[1]).join(" · "):"No daily target hit yet."}${bt("mains")?` · Mains test best ${bt("mains")} (Level ${MT.filter(v=>bt("mains")>=v).length})`:""}${bt("adv")?` · Adv paper best ${bt("adv")} (Level ${AT.filter(v=>bt("adv")>=v).length})`:""}</small></div>`}).join("")}
function testTab(){const td=ld(),AL=[...GT()].sort((a,b)=>a.d<b.d?-1:1),past=AL.filter(x=>x.d<td),L2=view.gpast?AL:AL.filter(x=>x.d>=td);
 return`<div class="ed"><h3>Add a test plan</h3><div class="form"><div><label>Type of test</label><select id="gtt">${ttOpts()}</select></div><div><label>Name of the test</label><input id="gtn" placeholder="e.g. Revision Test 1"></div><div><label>Date</label><input type="date" id="gtd" value="${td}"></div></div><div id="gtch">${gtChap("mains")}</div><p><button class="btn" data-act="gtadd">Add test</button> <button class="btn alt" data-act="gtclr">Clear chapter selection</button> <button class="btn alt" data-act="gtimp">Import PW planner tests</button></p></div>
 ${past.length?`<p><button class="btn alt" data-act="gtpast">${view.gpast?"Hide":"Show"} past tests (${past.length})</button></p>`:""}${L2.map(x=>{const dd=Math.round((Date.parse(x.d)-Date.parse(td))/864e5);return`<div class="dc" style="--c:${x.done?"var(--ok)":dd<0?"var(--bad)":"var(--acc)"}"><div style="display:flex"><label class="tk${x.done?" on":""}" style="flex:1"><input type="checkbox" data-act="gttk" data-id="${x.id}" ${x.done?"checked":""}><span><b>${dl8(x.d)} · ${esc(x.nm)}</b> <small>${TT[x.tt][0]} · ${x.done?"completed":dd<0?"overdue by "+(-dd)+" day(s)":dd===0?"today":"in "+dd+" day(s)"}</small></span></label><button class="x" data-act="gtdel" data-id="${x.id}" aria-label="Delete">✕</button></div>${SUBJ.some(s=>(x.ch[s]||[]).length)||!x.note?SUBJ.map(s=>`<p style="margin:4px 0"><b style="color:var(--${s})">${s}</b>: <small>${(x.ch[s]||[]).length?(x.ch[s].length>=chList(TT[x.tt][1],s).length?"Full syllabus ("+x.ch[s].length+" chapters)":esc(x.ch[s].join(" · "))):"no chapters selected"}</small></p>`).join(""):""}${x.note?`<p style="margin:4px 0"><small>📝 ${esc(x.note)}</small></p>`:""}</div>`}).join("")||"<p class='sub'>No tests planned yet.</p>"}`}
function planPage(){const t=view.pt||"day";if(t==="test"&&!data._gtimp2&&(typeof ro==="undefined"||!ro)){data._gtimp2=1;pwSeed()}const btn=(k,l)=>`<button class="btn${t===k?"":" alt"}" data-act="pt" data-t="${k}">${l}</button>`;
 return`<button class="back" data-act="back">← Back</button><h2>📅 Goal Planner</h2><div class="tabs">${btn("day","Day-wise")}${btn("week","Week-wise")}${btn("test","Test-wise")}</div>${t==="day"?dayTab():t==="week"?weekTab():testTab()}`}
function addGD(){const g=id=>document.getElementById(id).value,n=Math.max(0,parseInt(g("gdn"))||0);if(!n){alert("Enter the number of questions.");return false}
 const hv=g("gdh"),i=hv.indexOf("|");(data._gd=data._gd||[]).push({id:gid(),d:view.gd||ld(),k:"q",x:g("gdx"),s:g("gds"),ch:i>0?hv.slice(i+1):"",n,done:0});save();return true}
function addGDT(){const g=id=>document.getElementById(id).value,n=Math.max(0,parseInt(g("gdtn"))||0);if(!n){alert("Enter the number of tests.");return false}
 (data._gd=data._gd||[]).push({id:gid(),d:view.gd||ld(),k:"t",tt:g("gdtt"),n,done:0});save();return true}
function addGT(){const g=id=>document.getElementById(id).value,nm=(g("gtn")||"").trim();if(!nm){alert("Enter the name of the test.");return false}
 const ch=gsel();
 (data._gt=data._gt||[]).push({id:gid(),tt:g("gtt"),nm,d:g("gtd")||ld(),ch,done:0});view.gsel=ch;save();return true}
function pwSeed(){data._gt=(data._gt||[]).filter(x=>x.done||x.note!==undefined||!OLDSEED.has(x.d+"|"+x.nm));
 const have=new Set(GT().map(x=>x.d+"|"+x.nm+"|"+x.tt));let n=0;
 PWP.forEach(([d,tts,nm,note,ch])=>tts.split(",").forEach(tt=>{if(have.has(d+"|"+nm+"|"+tt))return;(data._gt=data._gt||[]).push({id:gid(),tt,nm,d,ch,note,done:0});n++}));
 save();return n}
function psheet(){return[["Date","Type","Subject","Chapter","Qs / Tests","Hours","Done"],...[...GD()].sort((a,b)=>a.d<b.d?-1:1).map(x=>x.k==="q"?[x.d,XL[x.x],x.s,x.ch||"",x.n,"",x.done?"Yes":"No"]:[x.d,TT[x.tt][0]+" (test)","","",x.n,x.n*3,x.done?"Yes":"No"])]}
function gtsheet(){return[["Date","Type","Test name","Physics chapters","Chemistry chapters","Maths chapters","Done","Note"],...[...GT()].sort((a,b)=>a.d<b.d?-1:1).map(x=>[x.d,TT[x.tt][0],x.nm,x.ch.Physics.join("; "),x.ch.Chemistry.join("; "),x.ch.Maths.join("; "),x.done?"Yes":"No",x.note||""])]}
app.addEventListener("input",ev=>{if(ev.target.id==="gdtn")document.getElementById("gdth").value=Math.max(0,parseInt(ev.target.value)||0)*3});
